summary: ""
boundaries:
  - name: .github
    globs:
      - .github/**
    role: config
  - name: knowledge
    globs:
      - knowledge/**
    role: config
  - name: root
    globs:
      - "*"
    role: config
  - name: site
    globs:
      - site/**
    role: site
  - name: src
    globs:
      - src/**
    role: code
  - name: test
    globs:
      - test/**
    role: test
